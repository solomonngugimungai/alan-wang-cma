<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CMA Test Suite</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:30px;background:#fafafa;color:#1a1a1a;max-width:900px;margin:0 auto}
  h1{font-size:22px;margin-bottom:4px;color:#cd1f3f}
  .meta{color:#6b7280;font-size:12px;margin-bottom:20px}
  .test{padding:6px 12px;margin:3px 0;border-radius:4px;font-family:"SF Mono",Menlo,monospace;font-size:12px;line-height:1.4}
  .pass{background:#e7f6ee;color:#0c6b3b;border-left:3px solid #0c6b3b}
  .fail{background:#fdecea;color:#a8231b;border-left:3px solid #a8231b}
  .summary{margin-top:24px;padding:14px 18px;border-radius:6px;font-weight:700;font-size:14px}
  .summary.ok{background:#e7f6ee;color:#0c6b3b}
  .summary.bad{background:#fdecea;color:#a8231b}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:18px 0 6px}
</style>
</head>
<body>
<h1>CMA Test Suite</h1>
<div class="meta">Runs in browser. Open this file directly or via the Pages URL. Asserts the parser, scorer, formatters, and URL helpers in cma.js.</div>
<div id="results"></div>
<div id="summary"></div>

<script src="cma.js"></script>
<script>
(function(){
  var pass=0, fail=0;
  var results=document.getElementById("results");

  function group(title){
    var h=document.createElement("h2");h.textContent=title;results.appendChild(h);
  }
  function record(name, ok, detail){
    var div=document.createElement("div");
    div.className="test "+(ok?"pass":"fail");
    div.textContent=(ok?"✓ ":"✗ ")+name+(ok?"":" — "+(detail||""));
    results.appendChild(div);
    ok?pass++:fail++;
  }
  function assertEq(name, actual, expected){
    record(name, actual===expected, "expected "+JSON.stringify(expected)+" got "+JSON.stringify(actual));
  }
  function assertTrue(name, cond, detail){record(name, !!cond, detail)}

  // ── Formatters ────────────────────────────────────────────────────
  group("Formatters");
  assertEq("esc escapes HTML",            esc("<script>"), "&lt;script&gt;");
  assertEq("fmt formats currency",        fmt(1395000),    "$1,395,000");
  assertEq("fmt handles null",            fmt(null),       "—");
  assertEq("fmt handles NaN",             fmt(NaN),        "—");
  assertEq("fmtD has 2 decimals",         fmtD(872.5),     "$872.50");
  assertEq("med even count",              med([1,2,3,4]),  2.5);
  assertEq("med odd count",               med([1,2,3,4,5]),3);
  assertEq("med empty",                   med([]),         0);

  // ── URL builders ──────────────────────────────────────────────────
  group("Address & URL helpers");
  DATA = {subjectAddress: "199 Oak Park Lane, Cupertino, CA 95014"};
  assertEq("fullAddr borrows city/state",  fullAddr("123 Main St"),
                                            "123 Main St, Cupertino, CA 95014");
  assertEq("fullAddr keeps complete",      fullAddr("123 Main St, Sunnyvale, CA"),
                                            "123 Main St, Sunnyvale, CA");
  var zu = zillowURL("123 Main St");
  assertTrue("zillowURL contains address slug",
             zu.indexOf("123-Main-St-Cupertino-CA-95014") !== -1, zu);
  assertTrue("zillowURL is https",         zu.indexOf("https://www.zillow.com/") === 0, zu);
  var ru = redfinURL("123 Main St");
  assertTrue("redfinURL contains query",   ru.indexOf("redfin.com/?q=") !== -1, ru);

  // ── Scoring (TJ's weights: 25/20/25/5/+25) ────────────────────────
  group("scoreComp — TJ Hufanga weights (max 100)");
  DATA = {subjectAddress:"199 Oak Park, Cupertino", subjectBeds:"2", subjectBaths:"2/0", subjectSqFt:1480};

  var perfect = scoreComp({beds:"2", baths:"2/0", sqft:1480, dom:10}, DATA);
  // 25 + 20 + 25 + 5 = 75 (school-zone bonus added by updateZoneScores)
  assertEq("perfect match = 75",           perfect.score, 75);

  var bedsOff = scoreComp({beds:"3", baths:"2/0", sqft:1480, dom:10}, DATA);
  // 12 + 20 + 25 + 5 = 62
  assertEq("beds ±1 = 62",            bedsOff.score, 62);

  var bedsBathOff = scoreComp({beds:"3", baths:"3/0", sqft:1480, dom:10}, DATA);
  // 12 + 10 + 25 + 5 = 52
  assertEq("beds ±1, bath ±1 = 52", bedsBathOff.score, 52);

  var allBad = scoreComp({beds:"4", baths:"4/0", sqft:3000, dom:200}, DATA);
  // 0 + 0 + 0 + 0 = 0
  assertEq("all variances exceeded = 0",   allBad.score, 0);

  var mid = scoreComp({beds:"3", baths:"3/0", sqft:1700, dom:100}, DATA);
  // beds±1: 12, bath±1: 10, sqft 1700 vs 1480 = 14.86% (within 20%): 17, dom 100 stale: 0 = 39
  assertEq("mixed signals = 39",           mid.score, 39);

  var sqftWithin10 = scoreComp({beds:"2", baths:"2/0", sqft:1500, dom:10}, DATA);
  // 25 + 20 + 25 + 5 = 75
  assertEq("sqft within 10% = 75",         sqftWithin10.score, 75);

  var sqftWithin30 = scoreComp({beds:"2", baths:"2/0", sqft:1900, dom:10}, DATA);
  // sqft 1900 vs 1480 = 28.4% (within 30%): 8 → 25+20+8+5 = 58
  assertEq("sqft within 30% partial = 58", sqftWithin30.score, 58);

  // ── Dollar-adjustment model (Alan's hand-pricing logic, v2.0) ─────
  group("Adjustment helpers");
  // remodelCost lookup against the default SETTINGS values (Poor=80k, Medium=25k).
  assertEq("remodelCost Move-in ready",  remodelCost("Move-in ready"), 0);
  assertEq("remodelCost Medium",         remodelCost("Medium"),        25000);
  assertEq("remodelCost Poor",           remodelCost("Poor"),          80000);

  // compBasePrice: sold uses sale, pending uses list, active is not a value comp.
  assertEq("compBasePrice sold → sale",  compBasePrice({status:"Sold",    comp:{salePrice:1500000, listPrice:1450000}}), 1500000);
  assertEq("compBasePrice sold falls back to list",
                                          compBasePrice({status:"Sold",    comp:{salePrice:null,    listPrice:1450000}}), 1450000);
  assertEq("compBasePrice pending → list",compBasePrice({status:"Pending", comp:{salePrice:null,    listPrice:1450000}}), 1450000);
  assertEq("compBasePrice active → null", compBasePrice({status:"Active",  comp:{salePrice:null,    listPrice:1450000}}), null);

  // Date parsing + recency.
  assertEq("parseCompDate mm/dd/yy",     parseCompDate("4/15/26").getFullYear(), 2026);
  assertEq("parseCompDate yyyy-mm-dd",   parseCompDate("2026-04-15").getMonth(), 3);
  assertEq("monthsAgo 12 months",        monthsAgo(new Date(2025,5,15), new Date(2026,5,15)), 12);

  group("scoreComp filter heuristic (still 0-100)");
  // Score is now purely the comparability heuristic — condition no longer modifies it.
  DATA = {subjectAddress:"199 Oak Park, Cupertino", subjectBeds:"2", subjectBaths:"2/0", subjectSqFt:1480};
  function setupAdjTest(subjCond, comps){
    CS = comps.map(function(c){
      return {
        comp:{beds:c.beds||"2", baths:c.baths||"2/0", sqft:c.sqft||1480,
              dom:c.dom!=null?c.dom:10,
              listPrice:c.listPrice||1500000, salePrice:c.salePrice||c.listPrice||1500000,
              statusDt:c.statusDt||null},
        status:c.status||"Sold",
        included:true, zone:"—",
        condition:c.condition||"Medium", description:"",
        acrossDivider:!!c.acrossDivider, locationHaircut:c.locationHaircut||0, zillowEstimate:null,
        score:0, flags:[], adjustedValue:null, weight:0, valueIncluded:false, exclusionReason:null
      };
    });
    var host=document.createElement("div");host.style.display="none";
    host.innerHTML='<select id="subj-zone"><option>—</option></select>'+
                   '<select id="subj-condition"><option>'+subjCond+'</option></select>'+
                   '<div id="comp-list"></div><div id="rev-summary-wrap"></div>';
    document.body.appendChild(host);
    updateScores();
    document.body.removeChild(host);
  }

  setupAdjTest("Medium", [{condition:"Medium"}]);
  assertEq("perfect property match → score 75", CS[0].score, 75);

  group("Adjusted value (condition + location haircut)");
  // Comp identical, both Medium → zero adjustment → adjustedValue = salePrice.
  setupAdjTest("Medium", [{salePrice:1500000, condition:"Medium"}]);
  assertEq("identical Medium ↔ Medium → adj = sale",    CS[0].adjustedValue, 1500000);

  // Subject Move-in, comp Poor → comp needs +$80k of work → adjust UP by $80k.
  setupAdjTest("Move-in ready", [{salePrice:1500000, condition:"Poor"}]);
  assertEq("subject Move-in, comp Poor → +$80k",        CS[0].adjustedValue, 1580000);

  // Subject Poor, comp Move-in → comp's price already reflects $80k of work → adjust DOWN.
  setupAdjTest("Poor", [{salePrice:1500000, condition:"Move-in ready"}]);
  assertEq("subject Poor, comp Move-in → −$80k",        CS[0].adjustedValue, 1420000);

  // Medium subject, Move-in comp → comp has $25k of work already done → adjust DOWN.
  setupAdjTest("Medium", [{salePrice:1500000, condition:"Move-in ready"}]);
  assertEq("subject Medium, comp Move-in → −$25k",      CS[0].adjustedValue, 1475000);

  // Location haircut: −15% on $1,500,000 = −$225,000 base; same condition = 0 cond adj.
  setupAdjTest("Medium", [{salePrice:1500000, condition:"Medium", locationHaircut:-15}]);
  assertEq("location haircut −15% on $1.5M → $1.275M",  CS[0].adjustedValue, 1275000);

  // Combined: condition +$80k AND location −15% on $1.5M base = 1500000 + (-225000) + 80000 = $1,355,000.
  setupAdjTest("Move-in ready", [{salePrice:1500000, condition:"Poor", locationHaircut:-15}]);
  assertEq("combined: loc −15% + cond +$80k = $1,355,000", CS[0].adjustedValue, 1355000);

  group("Divider handling");
  // Default mode is "exclude": across-divider comp keeps its adjustedValue but valueIncluded=false.
  SETTINGS.divider.mode = "exclude";
  setupAdjTest("Medium", [{salePrice:1500000, condition:"Medium", acrossDivider:true}]);
  assertEq("divider exclude: valueIncluded false",      CS[0].valueIncluded, false);
  assertEq("divider exclude: adjustedValue still set",  CS[0].adjustedValue, 1500000);

  // Down-weight mode applies the factor to weight; comp still counts.
  SETTINGS.divider.mode = "downweight"; SETTINGS.divider.factor = 0.5;
  setupAdjTest("Medium", [{salePrice:1500000, condition:"Medium", acrossDivider:true}]);
  assertEq("divider downweight: weight = 0.5",          CS[0].weight, 0.5);
  assertEq("divider downweight: valueIncluded true",    CS[0].valueIncluded, true);
  SETTINGS.divider.mode = "exclude"; // restore default

  group("Recommended price (weighted average)");
  // Three comps, all equal weight, average is plain mean.
  setupAdjTest("Medium", [
    {salePrice:1400000, condition:"Medium"},
    {salePrice:1500000, condition:"Medium"},
    {salePrice:1600000, condition:"Medium"}
  ]);
  var rec = recommendedPrice();
  assertEq("rec.n = 3",                      rec.n,     3);
  assertEq("rec.price = mean of 1.4/1.5/1.6M", rec.price, 1500000);
  assertEq("rec.low = 1,400,000",            rec.low,   1400000);
  assertEq("rec.high = 1,600,000",           rec.high,  1600000);

  // ── Parser ────────────────────────────────────────────────────────
  group("parse — MLSListings PDF text");
  var sample = [
    "Subject Property: 199 Oak Park Lane, Cupertino, CA 95014",
    "Status: Sold",
    "123 Oak Park Lane ML82000001 Res. Townhouse 1450 2 2/0 $1,320,000 4/15/26 12",
    "145 Oak Park Lane ML82000002 Res. Townhouse 1480 2 2/0 $1,380,000 3/22/26 9",
    "Status: Active",
    "412 Birch Way ML82000003 Res. Townhouse 1490 2 2/0 $1,450,000 5/1/26 34"
  ].join("\n");
  var d = parse(sample);

  assertEq("subject address parsed",       d.subjectAddress,
                                            "199 Oak Park Lane, Cupertino, CA 95014");
  assertEq("two status groups",            d.statusGroups.length, 2);
  assertEq("first group is Sold",          d.statusGroups[0].status, "Sold");
  assertEq("Sold has 2 comps",             d.statusGroups[0].comps.length, 2);
  assertEq("Active has 1 comp",            d.statusGroups[1].comps.length, 1);
  assertEq("first sold price = 1320000",   d.statusGroups[0].comps[0].price, 1320000);
  assertEq("first sold MLS = ML82000001",  d.statusGroups[0].comps[0].mls, "ML82000001");
  assertEq("first sold DOM = 12",          d.statusGroups[0].comps[0].dom, 12);

  // Single-price sold rows: parser populates listPrice; salePrice null.
  assertEq("single-price: listPrice set",  d.statusGroups[0].comps[0].listPrice, 1320000);
  assertEq("single-price: salePrice null", d.statusGroups[0].comps[0].salePrice, null);

  // ── Two-price parsing (sold lines with both list and sale) ────────
  group("Two-price parsing (list + sale)");
  var twoPriceSample = [
    "Subject Property: 100 Foo St, San Jose, CA 95014",
    "Status: Sold",
    "4599 Tilbury Drive ML82100001 Res. Single Family 1789 4 3/0 $2,390,000 66 $2,760,000 11/25/25 19"
  ].join("\n");
  var d2 = parse(twoPriceSample);
  var sold = d2.statusGroups[0].comps[0];
  assertEq("two-price: listPrice = 2390000", sold.listPrice, 2390000);
  assertEq("two-price: salePrice = 2760000", sold.salePrice, 2760000);
  // For sold comps, comp.price should be the sale price (more relevant).
  assertEq("two-price: price = sale",        sold.price,     2760000);

  // Active lines: only list price, no sale price.
  var activeSample = [
    "Subject Property: 100 Foo St, San Jose, CA 95014",
    "Status: Active",
    "3876 Gleason Avenue ML82200001 Res. Single Family 1876 4 3/0 $2,298,000 66 7"
  ].join("\n");
  var dA = parse(activeSample);
  var act = dA.statusGroups[0].comps[0];
  assertEq("active: listPrice = 2298000", act.listPrice, 2298000);
  assertEq("active: salePrice = null",    act.salePrice, null);
  assertEq("active: price = list",        act.price,     2298000);

  // ── Summary ───────────────────────────────────────────────────────
  var summary = document.getElementById("summary");
  var ok = fail===0;
  summary.className = "summary " + (ok?"ok":"bad");
  summary.textContent = (ok ? "✓ All passing — " : "✗ ")
    + pass + " passed, " + fail + " failed. CMA v" + (typeof VERSION!=="undefined"?VERSION:"?");
  // Expose for CI scrapers
  window.__TEST_RESULTS__ = {pass: pass, fail: fail};
})();
</script>
</body>
</html>
