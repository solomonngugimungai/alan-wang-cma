# ─────────────────────────────────────────────────────────────────────────────
#  CMA PROCESSOR — CONFIG
#
#  Two sections below:
#    PART 1: FILL IN FOR EACH NEW CMA  (the subject property you're pricing)
#    PART 2: SET ONCE, THEN LEAVE ALONE  (branding, adjustment $$, MLS column
#                                          names, status terms)
#
#  Workflow for each new property:
#    1) Export comps from proMLS to comps.csv
#    2) Update the `subject:` block below with this property's details
#    3) Run:  python cma_processor.py --input comps.csv
#    4) Open CMA_report.html, review with Alan, then print to PDF (or use --pdf)
# ─────────────────────────────────────────────────────────────────────────────


# ═════════════════════════════════════════════════════════════════════════════
# PART 1 — FILL IN FOR EACH NEW CMA
# ═════════════════════════════════════════════════════════════════════════════

subject:
  address: "199 Oak Park Lane"
  city_type: "Cupertino · Townhouse"      # shown under the address
  beds: 2
  baths: 2
  sqft: 1480
  year_built: 2018
  hoa_monthly: 425                         # number only, no $
  parking: "2-car attached garage"

# If set, comps whose subdivision or address contains this string are treated
# as "same complex" and weighted more heavily. Leave blank ("") to disable.
subject_subdivision: "Oak Park"


# ═════════════════════════════════════════════════════════════════════════════
# PART 2 — SET ONCE, THEN LEAVE ALONE
# ═════════════════════════════════════════════════════════════════════════════

branding:
  firm: "Alan Wang Realty"
  office: "Cupertino Office"
  prepared_by: "Alan Wang"

# Dollar values used to adjust comps toward the subject property.
# If a comp has MORE sqft than the subject, its sale price is adjusted DOWN by
# (extra sqft × dollars_per_sqft), and vice versa. Tune to your market once,
# then leave alone. Bay Area defaults shown.
adjustments:
  dollars_per_sqft: 400
  dollars_per_bed: 30000
  dollars_per_bath: 15000

  # How much heavier same-complex comps weigh in the recommended price.
  # 3.0 means a same-complex comp counts as 3 normal comps.
  same_complex_weight: 3.0
  default_weight: 1.0

  # Optional: monthly market drift (%). A comp that closed 3 months ago is
  # adjusted up by (3 × this %) of its sale price.
  # 0 = off, positive = rising market, negative = falling.
  monthly_market_drift_pct: 0.4

pricing:
  # Include pending sales in the value calculation? They're a strong signal of
  # current demand even though they haven't closed yet.
  include_pending_in_value: true

  # Round the final recommended price to the nearest N dollars.
  round_to: 5000

  # The "supported range" uses the middle 50% (IQR) of adjusted comp values
  # when there are at least 4 comps; otherwise min-max.


# ─────────────────────────────────────────────────────────────────────────────
# MLS column aliases — the tool tries each name (case/space-insensitive) until
# it finds a match in your CSV. If your MLS export uses a different header,
# ADD it to the list; don't remove the existing ones.
# ─────────────────────────────────────────────────────────────────────────────
columns:
  address:           [Address, "Street Address", "Property Address", "Full Address"]
  status:            [Status, "Listing Status", "MLS Status", "L/S Status"]
  beds:              [Beds, Bedrooms, BR, "Total Bedrooms"]
  baths:             [Baths, Bathrooms, BA, "Total Baths", "Full Baths"]
  sqft:              [SqFt, "Square Feet", "Living Area", "Approx SqFt", "Living Area SqFt"]
  list_price:        ["List Price", "Listing Price", LP, "Current List Price"]
  sale_price:        ["Sale Price", "Sold Price", "Close Price", "Selling Price", "Closed Price"]
  dom:               [DOM, "Days on Market", CDOM, "Cumulative DOM"]
  close_date:        ["Close Date", "Sold Date", "Closing Date", "Settlement Date"]
  subdivision:       [Subdivision, Complex, Community, Neighborhood, "HOA Name"]
  same_complex_flag: ["Same Complex", "Same Building", "Same Subdivision"]


# Map raw MLS status values to one of: sold / pending / active.
# Anything unrecognized is treated as "active" (a competing listing).
status_map:
  sold:    [Sold, S, Closed, CLS, "Closed Sale"]
  pending: [Pending, P, Pend, PEND, Contingent, "Active Under Contract"]
  active:  [Active, A, ACT, "Coming Soon", "Active With Contingencies"]
